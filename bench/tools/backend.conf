worker_processes auto;
pid /tmp/bench_backend.pid;
error_log /tmp/bench_backend_error.log;

events {
    worker_connections 1024;
}

http {
    access_log off;

    server {
        listen 8001;
        listen 8002;
        listen 8003;
        listen 8004;
        server_name _;

        root /tmp/bench_www;
        index response.txt;

        location / {
            try_files $uri /response.txt =404;
        }
    }
}
