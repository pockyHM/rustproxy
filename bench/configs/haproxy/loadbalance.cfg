global
    log /dev/null local0

defaults
    mode http
    timeout client 30s
    timeout server 30s
    timeout connect 5s
    log global
    option dontlognull
    option dontlog-normal

frontend proxy
    bind 127.0.0.1:9002
    default_backend weighted

backend weighted
    balance roundrobin
    server s1 127.0.0.1:8001 weight 4
    server s2 127.0.0.1:8002 weight 3
    server s3 127.0.0.1:8003 weight 2
    server s4 127.0.0.1:8004 weight 1
