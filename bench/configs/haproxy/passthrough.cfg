global
    log /dev/null local0

defaults
    mode http
    timeout client 30s
    timeout server 30s
    timeout connect 5s
    log global
    option dontlognull
    option dontlog-normal

frontend proxy
    bind 127.0.0.1:9002
    default_backend backend

backend backend
    server s1 127.0.0.1:8001
